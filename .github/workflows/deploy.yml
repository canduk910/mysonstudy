# CI/CD — push마다 빌드 검증, main 푸시면 Cloud Run 배포
#
# 인증: Workload Identity Federation (키 파일·GitHub Secret 없음).
#   canduk910/mysonstudy 저장소의 워크플로만 github-deployer SA로 인증된다.
# eval(npm run eval:english)은 CI에 넣지 않는다 — 실제 OpenAI 호출이 발생하는
#   수동 전용 회귀 테스트다 (docs/harness/english.md §5). 프롬프트 수정 시 로컬에서 돌리고 커밋할 것.
# 서비스의 env·secret(OPENAI_MODEL, OPENAI_API_KEY 등)은 최초 배포 때 설정된 값이
#   재배포에도 유지되므로 여기서 다시 지정하지 않는다.
# 예외: 가족 스트릭 알림(VAPID_*·PUSH_CRON_SECRET)은 GitHub Secrets에서 매 배포마다
#   --update-env-vars로 넘긴다(README의 --update-secrets APP_PIN과 같은 "병합" 계열 —
#   --set-env-vars는 지정하지 않은 기존 env를 전부 지워서 쓸 수 없다). GitHub Secrets가
#   아직 없으면 빈 문자열이 되어 해당 env가 빈 값으로 설정되는데, 알림 기능은 그 네 값이
#   비거나 없으면 501/401로 안전하게 꺼지도록 만들어져 있다(배포 자체는 그대로 성공).

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write # WIF 토큰 발급용

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Cloud Run Buildpacks 기본과 맞춤
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    concurrency: deploy-cloud-run # 연속 푸시 시 배포가 겹치지 않게
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/273068330044/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@eunwoo-bookcard.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy to Cloud Run (source)
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_CRON_SECRET: ${{ secrets.PUSH_CRON_SECRET }}
        run: |
          gcloud run deploy eunwoo-bookcard \
            --source . \
            --region asia-northeast3 \
            --project eunwoo-bookcard \
            --update-env-vars "VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY},VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY},VAPID_SUBJECT=${VAPID_SUBJECT},PUSH_CRON_SECRET=${PUSH_CRON_SECRET}" \
            --quiet

      # Hosting CDN 퍼지 — 이 단계가 없어서 배포한 화면이 안 보이는 사고가 났다(2026-08-20).
      #
      # eunwoo.site → Firebase Hosting(CDN) --rewrite--> Cloud Run 구조인데,
      # `gcloud run deploy`는 오리진만 갈아 끼울 뿐 **엣지에 남은 응답을 비우지 않는다.**
      # Next가 정적 페이지에 붙이던 `s-maxage=31536000`(1년)은 "배포 때 CDN을 퍼지한다"는
      # 전제 위에 있는 값이라, 퍼지가 없으면 옛 HTML이 최대 1년 그대로 나간다.
      # 옛 HTML은 `/_next/static/<BUILD_ID>/…`를 물고 있어 **옛 앱이 통째로 계속 돈다.**
      #
      # 헤더는 이미 `private, no-cache, must-revalidate`로 고쳤다(next.config.ts).
      # 이 단계는 그 뒤에 서는 안전망이다 — 앞으로 어떤 경로가 다시 공유 캐시를 받더라도
      # 배포마다 엣지가 갱신된다. `public-hosting/`은 rewrite 설정만 담은 빈 디렉터리라
      # 올라가는 파일이 사실상 없고, 릴리스 생성이 곧 무효화다.
      #
      # 권한: github-deployer SA에 roles/firebasehosting.admin 이 필요하다.
      # firebase-tools는 google-github-actions/auth 가 설정한 자격증명을 그대로 쓴다.
      - name: Purge Hosting CDN
        run: npx --yes firebase-tools@15 deploy --only hosting --project eunwoo-bookcard --non-interactive
